"$schema" = "schemas/schema.json"

[default]
description = "Default permission set for VCP Mobile plugin"
permissions = [
    "allow-set-keep-screen-on",
    "allow-clear-keep-screen-on",
    "allow-start-streaming-service",
    "allow-stop-streaming-service",
    "allow-acquire-foreground",
    "allow-release-foreground",
    "allow-start-helper-service",
    "allow-check-all-permissions",
    "allow-request-android-permission",
    "allow-move-task-to-back",
    "allow-check-notification-listener-permission",
    "allow-request-notification-listener-permission",
    "allow-request-auto-start-permission",
    "allow-request-power-management-permission",
    "allow-check-auto-start-permission",
    "allow-get-free-disk-space",
    "allow-pick-file",
    "allow-get-battery-status",
    "allow-get-network-status",
    "allow-open-file-native",
    "allow-share-file-native",
    "allow-get-process-exit-diagnostics",
    "allow-capture-window-snapshot",
    "allow-save-image-to-gallery",
    "allow-save-image-from-path",
    "allow-write-temp-file",
    "allow-delete-temp-file",
    "allow-start-download-notification",
    "allow-update-download-notification",
    "allow-cancel-download-notification",
    "allow-get-pending-notification",
    "allow-request-overlay-permission",
    "allow-register-shared-files",
    "allow-toggle-floating-ball",
    "allow-start-sensor-collection",
    "allow-stop-sensor-collection",
    "allow-get-sensor-data",
    "allow-get-cpu-thermal-status",
    "allow-get-gpu-status",
    "allow-check-root-access",
    "allow-launch-root-manager",
    "allow-acquire-wake-lock",
    "allow-release-wake-lock",
    "allow-start-network-monitoring",
]
